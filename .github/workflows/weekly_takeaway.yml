name: Refresh Monthly Takeaway

on:
  schedule:
    - cron: '30 12 * * 1'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas requests beautifulsoup4 lxml pytz streamlit

      - name: Generate takeaway
        run: python takeaway_generator.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add auto_monthly_takeaway.json
          git diff --staged --quiet || git commit -m "chore: auto-refresh monthly takeaway [skip ci]"
          git push
